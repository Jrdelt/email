[project]
name = "phishml"
version = "0.1.0"
description = "Feature extraction and training for phishing email detection"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5", "numpy>=1.26", "pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phishml"]
