name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: extension } }
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all
      - run: npm run zip:all
      - name: Verify <500 KB unpacked bundle budget
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import path from 'node:path';
            const sizeOf = (p) => fs.readdirSync(p, { withFileTypes: true }).reduce((n, d) =>
              n + (d.isDirectory() ? sizeOf(path.join(p, d.name)) : fs.statSync(path.join(p, d.name)).size), 0);
            for (const dir of ['.output/chrome-mv3', '.output/edge-mv3', '.output/firefox-mv3']) {
              const bytes = sizeOf(dir);
              console.log(dir + ': ' + bytes + ' bytes');
              if (bytes >= 500 * 1024) throw new Error(dir + ' exceeds 500 KB budget: ' + bytes);
            }
          "
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No python-version here: uv uses ml/.python-version, the interpreter whose Unicode database the parity
      # fixture was generated with (test_unicode_database_is_the_pinned_one).
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
