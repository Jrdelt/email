name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: extension } }
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all
      - run: npm run zip:all
      - name: Verify <500 KB unpacked bundle budget
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import path from 'node:path';
            const sizeOf = (p) => fs.readdirSync(p, { withFileTypes: true }).reduce((n, d) =>
              n + (d.isDirectory() ? sizeOf(path.join(p, d.name)) : fs.statSync(path.join(p, d.name)).size), 0);
            for (const dir of ['.output/chrome-mv3', '.output/edge-mv3', '.output/firefox-mv3']) {
              const bytes = sizeOf(dir);
              console.log(dir + ': ' + bytes + ' bytes');
              if (bytes >= 500 * 1024) throw new Error(dir + ' exceeds 500 KB budget: ' + bytes);
            }
          "
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
